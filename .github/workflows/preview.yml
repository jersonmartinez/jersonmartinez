name: Build pull request preview

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/preview.yml'
  # Permite construir el preview de una rama a demanda.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build preview archive
        run: tar -C dist --exclude='.git' --exclude='node_modules' -czf "$RUNNER_TEMP/site-preview.tar.gz" .
      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/site-preview.tar.gz
          retention-days: 7
