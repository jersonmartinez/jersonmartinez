name: Build pull request preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build preview archive
        run: tar -C dist --exclude='.git' --exclude='node_modules' -czf "$RUNNER_TEMP/site-preview.tar.gz" .
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/site-preview.tar.gz
          retention-days: 7
