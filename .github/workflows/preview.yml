name: Build pull request preview

on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - 'src/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
      - name: Build preview archive
        run: tar --exclude='.git' --exclude='node_modules' -czf "$RUNNER_TEMP/site-preview.tar.gz" .
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/site-preview.tar.gz
          retention-days: 7
