name: Update README YouTube content

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal a actualizar; vacío significa todos'
        required: false
        type: string
      limit:
        description: 'Cantidad de videos por canal'
        required: false
        default: '6'
        type: string
      dry_run:
        description: 'Solo generar el reporte, sin cambios'
        required: false
        default: false
        type: boolean

concurrency:
  group: readme-youtube-content
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Synchronize YouTube content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          args=(--limit "${{ inputs.limit || '6' }}")
          if [ -n "${{ inputs.channel }}" ]; then args+=(--channel "${{ inputs.channel }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          node src/js/update-youtube-sections.js "${args[@]}"

      - name: Create update pull request
        if: ${{ inputs.dry_run != true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: refresh YouTube content'
          title: 'docs: refresh YouTube content'
          body: |
            ## Automated YouTube refresh

            This PR was generated from the configured channel sources.

            - The README is updated atomically.
            - Failed sources keep their last valid content.
            - Validation runs before merge.
          branch: automation/youtube-content
          delete-branch: true
          labels: documentation,automation
          assignees: jersonmartinez
          draft: false
