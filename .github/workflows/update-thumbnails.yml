name: Update README YouTube content

on:
  push:
    branches: [main]
    paths:
      - README.md
      - src/js/update-youtube-sections.js
      - .github/workflows/update-thumbnails.yml
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: readme-youtube-content
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update YouTube sections
        run: node src/js/update-youtube-sections.js

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update YouTube content [skip ci]"
          git push origin HEAD:main
