name: E2E (Playwright)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/e2e/**'
      - 'playwright.config.cjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      # Playwright fijado sin tocar el lockfile; se instala el navegador chromium.
      - name: Install pinned Playwright + http-server
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0 axe-core@4.13.0 http-server@14.1.1 wait-on@8.0.1
      - name: Install Playwright chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Serve built site
        run: |
          npx --no-install http-server dist -p 4321 -a 127.0.0.1 --silent &
          echo $! > server.pid
          npx --no-install wait-on http://127.0.0.1:4321/ -t 20000 || sleep 3
      # Medidas de diseno sobre el dist servido: desbordamiento, compresion del header,
      # desplazamiento de ancla frente a la altura real del header, separacion del
      # encabezado, medida de lectura, alineacion de tarjetas, CTA en el primer viewport
      # movil y contraste de la marca en AMBOS temas.
      - name: Validate design metrics
        env:
          BASE_URL: http://127.0.0.1:4321
        run: npm run validate:design -- "$BASE_URL"
      - name: Run E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4321
        run: npx --no-install playwright test --config playwright.config.cjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/**
          retention-days: 14
      - name: Stop local server
        if: always()
        run: kill "$(cat server.pid)" || true
