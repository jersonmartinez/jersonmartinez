name: Validate Astro portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'vercel.json'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Construir ANTES de los tests para que la suite con VALIDATE_BUILD=1 valide
      # el HTML compilado real (dist/), no sólo las fuentes.
      - run: npm run build
      # astro check, TypeScript y stylelint viven ahora en devDependencies, asi que npm ci
      # los reproduce con integridad verificada y Dependabot los ve. Antes se instalaban con
      # npm install --no-save, fuera del lockfile y sin verificacion de sus transitivas.
      - name: Type-check (astro check)
        run: npm run check
      # Geometria del sprite de iconos: ningun otro gate compara geometria, y un glifo
      # recortado por un viewBox mal encajado sobrevivio a Lighthouse, pa11y, axe y la suite.
      - name: Validate icon sprite geometry
        run: npm run validate:sprite
      - name: Run tests against the compiled build
        run: VALIDATE_BUILD=1 npm test
      - run: VALIDATE_BUILD=1 npm run validate
      - run: npm run links
      - name: Validate security headers, social metadata, schema.org and sitemap
        run: npm run headers
      - name: Ensure root robots/sitemap stay in sync with public/
        run: npm run sync:static:check
      - name: Ensure sitemap matches the real routes and review date
        run: npm run sitemap:check
      # Cobertura de traduccion y ausencia de espanol en /en, medidas sobre el dist
      # construido: es lo unico que demuestra que la version inglesa esta completa,
      # porque no depende de recordar cada sitio donde hay texto.
      - name: Validate i18n coverage and language leaks
        run: npm run validate:i18n
      - run: npm run youtube:dry-run
      # markdownlint fijado (sin npx --yes): se instala la versión exacta sin
      # tocar el lockfile y se invoca el binario local, cubriendo README y docs/**.
      - name: Install pinned markdownlint
        run: npm install --no-save --no-package-lock markdownlint-cli2@0.23.3
      - name: Lint markdown (README + docs)
        run: npx --no-install markdownlint-cli2 "README.md" "SECURITY.md" "SECURITY-HEADERS.md" "CONTRIBUTING.md" "docs/**/*.md"
      # stylelint con orden de propiedades y prohibicion de color literal en las capas que
      # SI declaran color (base.css y components.css). El alcance anterior apuntaba a
      # global.css, fonts.css y un icons.css inexistente, ninguno con colores: la guarda
      # estaba vacia y por eso sobrevivieron 55 literales rgba().
      - name: Lint CSS (stylelint)
        run: npm run lint:css
      - run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7 .github/workflows/*.yml
