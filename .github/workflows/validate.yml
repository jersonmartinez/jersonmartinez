name: Validate profile and automation

on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.md'
      - 'README.md'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'config/**'
      - 'data/**'
      - 'src/js/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'config/**'
      - 'data/**'
      - 'src/js/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Check JavaScript syntax
        run: |
          node --check src/js/update-youtube-sections.js
          node --check tools/validate-site.js
          node --check tools/check-links.js

      - name: Run unit tests
        run: npm test

      - name: Validate site and local links
        run: |
          npm run validate
          npm run links

      - name: Validate YouTube generator offline
        run: npm run youtube:dry-run

      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.17.2 README.md

      - name: Validate GitHub Actions syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7
