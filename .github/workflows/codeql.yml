name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 6 * * 1'
  # Permite re-escanear una rama a demanda, p. ej. para inventariar la rama
  # COMPLETA: el check de un PR sólo anota las alertas que caen en su diff, así
  # que un hallazgo preexistente fuera del diff no aparece en ningún PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    # Único job del repositorio que no declaraba techo: sin él hereda las 6 h
    # por defecto de GitHub, así que un análisis colgado consume el presupuesto
    # entero antes de fallar. El escaneo real de este repo tarda ~1 min.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          category: /language:javascript-typescript
