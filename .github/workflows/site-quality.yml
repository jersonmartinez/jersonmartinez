name: Site quality gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.lighthouserc.json'
      - '.pa11yci.json'
      - '.github/workflows/site-quality.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build
      # Herramientas fijadas sin tocar el lockfile y SIN npx --yes: se instalan
      # versiones exactas y se invoca el binario local con npx --no-install.
      - name: Install pinned quality tools
        run: npm install --no-save --no-package-lock @lhci/cli@0.15.1 pa11y-ci@4.1.1 @playwright/test@1.63.0 http-server@14.1.1 wait-on@8.0.1
      - name: Install compatible Chromium headless shell
        run: npx --no-install playwright install --with-deps chromium
      - name: Resolve Chromium headless shell
        run: |
          chrome_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*chromium_headless_shell*/chrome-headless-shell-linux64/chrome-headless-shell' -print -quit)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Serve built site
        run: |
          npx --no-install http-server dist -p 4321 -a 127.0.0.1 --silent &
          echo $! > server.pid
          npx --no-install wait-on http://127.0.0.1:4321/ -t 20000 || sleep 3
      - name: Lighthouse CI (explicit budgets)
        # Las seis rutas espanolas mas DOS inglesas representativas (inicio y una
        # pagina interior). Las doce comparten componentes, CSS, imagenes y scripts,
        # asi que el peso y el rendimiento son los mismos; lo unico que cambia es la
        # longitud del texto. Medir las doce duplicaria a 36 corridas dentro de un
        # job con 25 minutos de techo sin medir nada nuevo. La accesibilidad de las
        # seis inglesas SI se cubre entera, en el gate de pa11y de abajo.
        run: |
          npx --no-install lhci autorun \
            --collect.url=http://127.0.0.1:4321/ \
            --collect.url=http://127.0.0.1:4321/projects.html/ \
            --collect.url=http://127.0.0.1:4321/courses.html/ \
            --collect.url=http://127.0.0.1:4321/certifications.html/ \
            --collect.url=http://127.0.0.1:4321/experience.html/ \
            --collect.url=http://127.0.0.1:4321/about.html/ \
            --collect.url=http://127.0.0.1:4321/en/ \
            --collect.url=http://127.0.0.1:4321/en/projects.html/ \
            --collect.settings.chromeFlags="--no-sandbox --headless=new" \
            --upload.target=filesystem \
            --upload.outputDir=./.lighthouseci
      - name: Accessibility gate (pa11y-ci, WCAG2AA)
        # Las doce rutas: la version inglesa tiene su propio `lang`, sus propios
        # nombres accesibles y su conmutador de idioma, asi que una regresion de
        # accesibilidad puede existir solo ahi. pa11y es rapido y cubrirlas todas
        # no pone en riesgo el timeout del job.
        run: |
          npx --no-install pa11y-ci --config .pa11yci.json \
            http://127.0.0.1:4321/ \
            http://127.0.0.1:4321/projects.html/ \
            http://127.0.0.1:4321/courses.html/ \
            http://127.0.0.1:4321/certifications.html/ \
            http://127.0.0.1:4321/experience.html/ \
            http://127.0.0.1:4321/about.html/ \
            http://127.0.0.1:4321/en/ \
            http://127.0.0.1:4321/en/projects.html/ \
            http://127.0.0.1:4321/en/courses.html/ \
            http://127.0.0.1:4321/en/certifications.html/ \
            http://127.0.0.1:4321/en/experience.html/ \
            http://127.0.0.1:4321/en/about.html/
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-quality-reports
          path: |
            .lighthouseci/**
          retention-days: 14
      - name: Stop local server
        if: always()
        run: kill "$(cat server.pid)" || true
